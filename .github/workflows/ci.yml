name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: 前端（构建 + 测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @procure-lite/shared build
      - run: pnpm --filter @procure-lite/web typecheck
      - run: pnpm --filter @procure-lite/web test
      - run: pnpm --filter @procure-lite/web build

  server:
    name: 服务端（构建 + 测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @procure-lite/shared build
      - run: pnpm --filter @procure-lite/server typecheck
      - run: pnpm --filter @procure-lite/server test
      - run: pnpm --filter @procure-lite/server build

  ocr:
    name: OCR 解析服务（测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装轻依赖
        working-directory: apps/ocr
        run: pip install -e ".[dev]"
      - name: 运行测试（无需 PaddleOCR）
        working-directory: apps/ocr
        run: pytest -v

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [web, server, ocr]
    steps:
      - uses: actions/checkout@v4
      - name: 构建三个镜像
        run: |
          docker build -f deploy/Dockerfile.web -t procure-lite/web:ci .
          docker build -f deploy/Dockerfile.server -t procure-lite/server:ci .
          docker build -f deploy/Dockerfile.ocr -t procure-lite/ocr:ci .
