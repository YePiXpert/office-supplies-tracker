name: procure-lite

# 镜像优先从 GHCR 拉取（CI 自动构建推送）；
# 若无法访问 GHCR 或需要本地改动，docker compose up --build 走本地构建
services:
  web:
    image: ghcr.io/yepixpert/procure-lite-web:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    image: ghcr.io/yepixpert/procure-lite-server:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    environment:
      DATA_DIR: /app/state
      OCR_BASE_URL: http://ocr:8000
      OCR_API_KEY: ${OCR_API_KEY:-please-change-ocr-key}
    volumes:
      - procure-state:/app/state
    depends_on:
      - ocr
    restart: unless-stopped

  ocr:
    image: ghcr.io/yepixpert/procure-lite-ocr:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.ocr
    environment:
      OCR_API_KEY: ${OCR_API_KEY:-please-change-ocr-key}
      OCR_MAX_CONCURRENT: "1"
    restart: unless-stopped

volumes:
  procure-state:
